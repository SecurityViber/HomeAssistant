views:
- type: sections
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Master Caution
      subtitle: Active alerts & advisories
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.master_caution
        state: 'off'
      card:
        type: custom:mushroom-template-card
        primary: All systems nominal
        secondary: No active alerts
        icon: mdi:shield-check
        icon_color: green
        layout: horizontal
        multiline_secondary: true
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.zigbee2mqtt_bridge_connection_state
        state: 'off'
      card:
        type: custom:mushroom-template-card
        primary: ZIGBEE NETWORK OFFLINE
        secondary: Lights, sensors and switches unreachable. Check the USB stick and Zigbee2MQTT.
        icon: mdi:zigbee
        icon_color: red
        layout: horizontal
        multiline_secondary: true
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.chrisinas_security_status
        state: 'on'
      card:
        type: custom:mushroom-template-card
        primary: NAS SECURITY ANOMALY
        secondary: Security anomaly detected on ChrisiNas.
        icon: mdi:shield-alert
        icon_color: red
        layout: horizontal
        multiline_secondary: true
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.dry_plants
        above: 0
      card:
        type: custom:mushroom-template-card
        primary: HYDRATION REQUIRED
        secondary: '{{ state_attr(''sensor.dry_plants'', ''plants'') | join('', '') }}'
        icon: mdi:water-alert
        icon_color: red
        layout: horizontal
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /chris-kims-leader-intelligence/botanical-diagnostics
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.low_battery_devices
        above: 0
      card:
        type: custom:mushroom-template-card
        primary: LOW POWER
        secondary: 'Replace batteries: {{ state_attr(''sensor.low_battery_devices'', ''devices'') | join('', '') }}'
        icon: mdi:battery-alert-variant-outline
        icon_color: amber
        layout: horizontal
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /chris-kims-leader-intelligence/facility-operations
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.pending_updates
        above: 0
      card:
        type: custom:mushroom-template-card
        primary: UPDATES AVAILABLE
        secondary: '{{ state_attr(''sensor.pending_updates'', ''updates'') | join('', '') }}'
        icon: mdi:package-up
        icon_color: blue
        layout: horizontal
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /config/updates
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Sectors
      subtitle: Facility map
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Living Room
      icon: mdi:sofa
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#living-room'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Kitchen
      icon: mdi:countertop-outline
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#kitchen'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Bedroom
      icon: mdi:bed-outline
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#bedroom'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Office
      icon: mdi:desk
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#office'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Gym
      icon: mdi:dumbbell
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#gym'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Hallway
      icon: mdi:door
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#hallway'
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Innovation Hub
      icon: mdi:lightbulb-on-outline
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#innovation-hub'
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: Environment
        subtitle: Global Sensor Data
      - type: horizontal-stack
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.ikea_air_quality_sensor_temperature
          name: Temperature
          icon: mdi:thermometer
          icon_color: blue
        - type: custom:mushroom-entity-card
          entity: sensor.ikea_air_quality_sensor_voc_index
          name: VOC Index
          icon: mdi:air-filter
          icon_color: green
    - type: custom:mushroom-template-card
      primary: Air Quality Diagnostics
      secondary: 'VOC: {{ states(''sensor.ikea_air_quality_sensor_voc_index'') }} | PM2.5: {{ states(''sensor.ikea_air_quality_sensor_pm25'')
        }} µg/m³'
      icon: mdi:molecule
      multiline_secondary: true
      color: |-
        {% if states('sensor.ikea_air_quality_sensor_pm25') | float > 25 %}
          red
        {% elif states('sensor.ikea_air_quality_sensor_pm25') | float > 10 %}
          orange
        {% else %}
          green
        {% endif %}
      features_position: bottom
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: System Integrity
      subtitle: Alerts & Operations
    - type: custom:mushroom-template-card
      primary: Active Illumination
      secondary: '{{ states.light | selectattr(''state'', ''eq'', ''on'') | rejectattr(''attributes.entity_id'', ''defined'')
        | list | count }} active lights'
      icon: mdi:lightbulb-multiple-outline
      color: '{{ ''amber'' if states.light | selectattr(''state'', ''eq'', ''on'') | rejectattr(''attributes.entity_id'',
        ''defined'') | list | count > 0 else ''disabled'' }}'
      features_position: bottom
      grid_options:
        columns: 12
        rows: 1
    - type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: Botanical Integrity
        subtitle: Soil moisture monitoring
      - type: custom:mushroom-template-card
        entity: sensor.strelitzia_soil_moisture
        primary: Strelitzia
        secondary: 'Moisture: {{ states(entity) }}%'
        icon: mdi:flower
        icon_color: '{{ ''green'' if states(entity)|int > 25 else ''red'' }}'
      - type: custom:mushroom-template-card
        entity: sensor.euphorbia_leuconeura_soil_moisture
        primary: Euphorbia
        secondary: 'Moisture: {{ states(entity) }}%'
        icon: mdi:sprout
        icon_color: '{{ ''green'' if states(entity)|int > 20 else ''red'' }}'
      - type: custom:mushroom-template-card
        entity: sensor.schlumbergera_soil_moisture
        primary: Schlumbergera
        secondary: 'Moisture: {{ states(entity) }}%'
        icon: mdi:cactus
        icon_color: '{{ ''green'' if states(entity)|int > 20 else ''red'' }}'
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Operations Log
      subtitle: Active Tasks & Notifications
    - type: custom:mushroom-template-card
      primary: |
        {% set v = states('sensor.ikea_air_quality_sensor_pm25') | int %} {% if v <= 12 %} Fresh Air {% elif v <= 35 %} Stuffy Air {% elif v <= 55 %} Poor Air Quality {% else %} Toxic Environment {% endif %}
      secondary: |
        {% set v = states('sensor.ikea_air_quality_sensor_pm25') | int %} {% if v <= 12 %} Everything is fine. {% elif v <= 35 %} Consider opening a window. {% elif v <= 55 %} Open windows immediately. {% else %} Evacuate or ventilate now. {% endif %} ({{ v }} µg/m³)
      icon: mdi:air-filter
      tap_action:
        action: more-info
      color: |
        {% set v = states('sensor.ikea_air_quality_sensor_pm25') | int %} {% if v <= 12 %} green {% elif v <= 35 %} yellow {% elif v <= 55 %} orange {% else %} red {% endif %}
      features_position: bottom
      multiline_secondary: true
      grid_options:
        columns: full
        rows: 1
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#living-room'
      name: Living Room
      icon: mdi:sofa
