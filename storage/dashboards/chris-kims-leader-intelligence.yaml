        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
        media_controls:
        - previous
        - play_pause_stop
        - next
        volume_controls:
        - volume_mute
        - volume_set
        - volume_buttons
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
        - type: entity
          entity: scene.living_room_chill_evening
          name: Chill Evening
          content_info: name
          icon: mdi:sofa-outline
