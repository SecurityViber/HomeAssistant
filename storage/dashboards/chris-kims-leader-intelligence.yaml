          icon: mdi:weather-sunset
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_golden_hours_2
        - type: entity
          entity: scene.stube_nighttime
          name: Nighttime
          content_info: name
          icon: mdi:weather-night
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_nighttime
        - type: entity
          entity: scene.stube_shine
          name: Shine
          content_info: name
          icon: mdi:white-balance-sunny
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_shine
        - type: entity
          entity: scene.stube_sleepy
          name: Sleepy
          content_info: name
          icon: mdi:sleep
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_sleepy
        - type: entity
          entity: scene.stube_storybook
          name: Storybook
          content_info: name
          icon: mdi:book-open-variant
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_storybook
        - type: entity
          entity: scene.stube_unwind
          name: Unwind
          content_info: name
          icon: mdi:sofa-outline
          tap_action:
            action: perform-action
            perform_action: scene.turn_on
            target:
              entity_id: scene.stube_unwind
