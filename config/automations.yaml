- id: '1771087316568'
  alias: 'Alarm: NAS Security Alert Christopher'
  description: Sends a standard English security alert to Christopher's iPhone
  triggers:
  - entity_id: binary_sensor.chrisinas_security_status
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - data:
      title: NAS Security Alert
      message: Security anomaly detected on ChrisiNas.
    action: notify.mobile_app_christophers_iphone
  - delay:
      minutes: 10
  mode: single
- id: '1771088319454'
  alias: Plant Hydration Management
  description: Direct alerts and acknowledgment when watering is successful.
  triggers:
  - id: dry
    entity_id:
    - sensor.0xa4c13837fc018338_soil_moisture
    - sensor.0xa4c1380d6560c17f_soil_moisture
    below: 20
    trigger: numeric_state
  - id: dry
    entity_id: sensor.0xa4c138a59afc575f_soil_moisture
    below: 25
    trigger: numeric_state
  - id: wet
    entity_id:
    - sensor.0xa4c13837fc018338_soil_moisture
    - sensor.0xa4c1380d6560c17f_soil_moisture
    above: 35
    trigger: numeric_state
  - id: wet
    entity_id: sensor.0xa4c138a59afc575f_soil_moisture
    above: 40
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - data:
          title: EXTREME THIRST
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is at {{ states(trigger.entity_id) }}%. Fix it.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: PLANT EMERGENCY
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            at {{ states(trigger.entity_id) }}%. Water it.
        action: notify.mobile_app_iphone_von_kim
      - delay:
          days: 7
    - conditions:
      - condition: trigger
        id: wet
      sequence:
      - data:
          title: HYDRATED
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is good. Thanks.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: HYDRATED
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            fine now. Thanks.
        action: notify.mobile_app_iphone_von_kim
  mode: restart
