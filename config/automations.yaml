- id: '1766683491744'
  alias: 'Office: Light on with presence'
  description: ''
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      motion_entity: binary_sensor.office_presence_sensor_presence
      light_target:
        entity_id: light.office_ceiling_light
      no_motion_wait: 0
- id: '1766683787264'
  alias: 'Bedroom: Light on with presence'
  description: ''
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      motion_entity: binary_sensor.bedroom_motion_sensor_occupancy
      light_target:
        entity_id: light.bed_light_strip
      no_motion_wait: 10
- id: '1766688495972'
  alias: 'Aqara Button 1: Toggle gym ceiling light'
  description: ''
  triggers:
  - domain: mqtt
    device_id: 1da4aea06a675be80f73bc4ba72958f7
    type: action
    subtype: single
    trigger: device
  conditions: []
  actions:
  - action: light.toggle
    metadata: {}
    target:
      entity_id: light.gym_ceiling_light
    data:
      transition: 1
  mode: single
- id: '1766871202931'
  alias: 'Hallway: Light follows presence'
  description: Turns the hallway light on when someone is in the hallway and fades
    it out over 2 minutes once it is empty.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion_sensor_occupancy
    to: 'on'
    id: occupied
  - trigger: state
    entity_id: binary_sensor.hallway_motion_sensor_occupancy
    to: 'off'
    id: clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hallway_light
        data:
          transition: 2
          brightness_pct: 100
    default:
    - action: light.turn_off
      target:
        entity_id: light.hallway_light
      data:
        transition: 120
  mode: restart
- id: '1771087316568'
  alias: 'NAS: Security alert'
  description: Sends a standard English security alert to Christopher's iPhone
  triggers:
  - entity_id: binary_sensor.chrisinas_security_status
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - data:
      title: NAS Security Alert
      message: Security anomaly detected on ChrisiNas.
    action: notify.mobile_app_christophers_iphone
  - delay:
      minutes: 10
  mode: single
- id: '1771088319454'
  alias: 'Plants: Watering alerts'
  description: Direct alerts and acknowledgment when watering is successful.
  triggers:
  - id: dry
    entity_id:
    - sensor.euphorbia_leuconeura_soil_moisture
    - sensor.schlumbergera_soil_moisture
    below: 20
    trigger: numeric_state
    for:
      minutes: 30
  - id: dry
    entity_id: sensor.strelitzia_soil_moisture
    below: 25
    trigger: numeric_state
    for:
      minutes: 30
  - id: wet
    entity_id:
    - sensor.euphorbia_leuconeura_soil_moisture
    - sensor.schlumbergera_soil_moisture
    above: 35
    trigger: numeric_state
    for:
      minutes: 30
  - id: wet
    entity_id: sensor.strelitzia_soil_moisture
    above: 40
    trigger: numeric_state
    for:
      minutes: 30
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - data:
          title: EXTREME THIRST
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is at {{ states(trigger.entity_id) }}%. Fix it.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: PLANT EMERGENCY
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            at {{ states(trigger.entity_id) }}%. Water it.
        action: notify.mobile_app_iphone_von_kim
    - conditions:
      - condition: trigger
        id: wet
      sequence:
      - data:
          title: HYDRATED
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is good. Thanks.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: HYDRATED
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            fine now. Thanks.
        action: notify.mobile_app_iphone_von_kim
  mode: restart
