- id: '1766688495972'
  alias: 'Aqara Button 1: Toggle gym ceiling light'
  description: ''
  triggers:
  - domain: mqtt
    device_id: 1da4aea06a675be80f73bc4ba72958f7
    type: action
    subtype: single
    trigger: device
  conditions: []
  actions:
  - action: light.toggle
    metadata: {}
    target:
      entity_id: light.gym_ceiling_light
    data:
      transition: 1
  mode: single
- id: '1766871202931'
  alias: 'Hallway: Light follows presence'
  description: Turns the hallway light on when someone is in the hallway and fades
    it out over 2 minutes once it is empty.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion_sensor_occupancy
    to: 'on'
    id: occupied
  - trigger: state
    entity_id: binary_sensor.hallway_motion_sensor_occupancy
    to: 'off'
    id: clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hallway_light
        data:
          transition: 2
          brightness_pct: 100
    default:
    - action: light.turn_off
      target:
        entity_id: light.hallway_light
      data:
        transition: 120
  mode: restart
- id: '1771087316568'
  alias: 'NAS: Security alert'
  description: Sends a standard English security alert to Christopher's iPhone
  triggers:
  - entity_id: binary_sensor.chrisinas_security_status
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - data:
      title: NAS Security Alert
      message: Security anomaly detected on ChrisiNas.
    action: notify.mobile_app_christophers_iphone
  - delay:
      minutes: 10
  mode: single
- id: '1771088319454'
  alias: 'Plants: Watering alerts'
  description: Direct alerts and acknowledgment when watering is successful.
  triggers:
  - id: dry
    entity_id:
    - sensor.euphorbia_leuconeura_soil_moisture
    - sensor.schlumbergera_soil_moisture
    below: 20
    trigger: numeric_state
    for:
      minutes: 30
  - id: dry
    entity_id: sensor.strelitzia_soil_moisture
    below: 25
    trigger: numeric_state
    for:
      minutes: 30
  - id: wet
    entity_id:
    - sensor.euphorbia_leuconeura_soil_moisture
    - sensor.schlumbergera_soil_moisture
    above: 35
    trigger: numeric_state
    for:
      minutes: 30
  - id: wet
    entity_id: sensor.strelitzia_soil_moisture
    above: 40
    trigger: numeric_state
    for:
      minutes: 30
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - data:
          title: EXTREME THIRST
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is at {{ states(trigger.entity_id) }}%. Fix it.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: PLANT EMERGENCY
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            at {{ states(trigger.entity_id) }}%. Water it.
        action: notify.mobile_app_iphone_von_kim
    - conditions:
      - condition: trigger
        id: wet
      sequence:
      - data:
          title: HYDRATED
          message: Christopher, the {{ state_attr(trigger.entity_id, 'friendly_name')
            }} is good. Thanks.
        action: notify.mobile_app_christophers_iphone
      - data:
          title: HYDRATED
          message: Kim, the {{ state_attr(trigger.entity_id, 'friendly_name') }} is
            fine now. Thanks.
        action: notify.mobile_app_iphone_von_kim
  mode: restart
- id: system_zigbee_offline_alert
  alias: 'System: Zigbee network alert'
  description: Warns when the Zigbee2MQTT bridge is offline for 5 minutes, and when
    it is back.
  triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
    for:
      minutes: 5
    id: offline
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    from: 'off'
    to: 'on'
    id: restored
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: offline
      sequence:
      - action: notify.mobile_app_christophers_iphone
        data:
          title: ZIGBEE NETWORK OFFLINE
          message: Lights, sensors and switches are unreachable. Check the USB stick
            and the Zigbee2MQTT add-on.
          data:
            push:
              interruption-level: time-sensitive
    - conditions:
      - condition: trigger
        id: restored
      sequence:
      - action: notify.mobile_app_christophers_iphone
        data:
          title: Zigbee network restored
          message: All Zigbee devices are reachable again.
  mode: single
- id: system_low_battery_alert
  alias: 'System: Low battery alert'
  description: Notifies when a device battery drops below 20%, and every Saturday
    while any are low.
  triggers:
  - trigger: state
    entity_id: sensor.low_battery_devices
    id: changed
  - trigger: time
    at: '10:00:00'
    id: weekly
  conditions:
  - condition: numeric_state
    entity_id: sensor.low_battery_devices
    above: 0
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: changed
      - condition: template
        value_template: '{{ trigger.from_state is not none and trigger.from_state.state
          | is_number and trigger.to_state.state | int(0) > trigger.from_state.state
          | int(0) }}'
    - condition: and
      conditions:
      - condition: trigger
        id: weekly
      - condition: time
        weekday:
        - sat
  actions:
  - action: notify.mobile_app_christophers_iphone
    data:
      title: LOW POWER
      message: 'Replace batteries: {{ state_attr(''sensor.low_battery_devices'', ''devices'')
        | join('', '') }}'
  mode: single
